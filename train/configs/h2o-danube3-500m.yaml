# Table 14 (prd.md), verbatim except the precision line -- see `precision_note`.
# This file is read by train/kaggle_finetune.ipynb; nothing here is a tuning knob.
#
# WHY THIS MODEL EXISTS, since it is the one config that is not in prd.md Table 14
# as originally frozen. The other three models sit at three different parameter
# counts in three different families (SmolLM2 0.36B / HuggingFace, Qwen2.5 0.49B /
# Alibaba, Llama-3.2 1.24B / Meta), so size and family are perfectly aliased: no two
# of them share a family, and every pairwise comparison therefore changes two things
# at once. RQ1 asks for the trade-off ACROSS 0.36-1.2B, so varying size is the point
# and is not the problem; the problem is that nothing in the design separates "bigger"
# from "different pretraining recipe".
#
# h2o-danube3-500m-chat is 500M against Qwen2.5-0.5B-Instruct's 494M -- an
# iso-parameter control. With it the design stops being a diagonal: the Qwen/Danube
# pair measures the family effect with size held constant, and the 0.36-1.2B span
# still measures the size effect. Its own technical report benchmarks it as
# comparable to Qwen2-0.5B-Instruct, so the pair is two models the literature treats
# as peers -- whichever wins here is a task-specific finding, not a foregone one.
name: h2o-danube3-500m-chat
hf_id: h2oai/h2o-danube3-500m-chat
gated: false
chat_template: >
  H2O-Danube3 (the model's own tokenizer.apply_chat_template -- never hand-written).
  NOT one of the common families: it renders as `<|prompt|>{user}</s><|answer|>`,
  not ChatML and not Llama-3. On the llama.cpp side it is not one of the hardcoded
  template detections, so `llama-server` may need `--jinja` to evaluate the template
  embedded in the GGUF via Minja. Only reachable if this model is ever promoted to
  Surface B; if it is, the flag must be added for ALL FOUR models and
  eval/test_template_parity.py re-run against the existing three to prove none of
  their token IDs moved.

supports_system_role: false
prompt_rendering_note: >
  MEASURED, not predicted: the first Kaggle attempt died at
  `jinja2.exceptions.TemplateError: System role not supported`. This template has no
  system role at all -- it raises rather than rendering one. The other three models
  all take a system turn, and the frozen prompt puts the parser instruction there.

  Resolved by folding the system prompt into the user turn for models whose template
  refuses a system role: `SYSTEM_PROMPT + "\n\n" + transcript`, one user message.
  The model reads the same two strings in the same order; only the role scaffolding
  the template wraps them in differs. This is the conventional workaround for
  system-less templates, not an invention.

  The notebook PROBES for this rather than keying off a model name, so the three
  already-trained models provably keep their byte-identical system-turn rendering --
  their adapters and every published number depend on it. One helper
  (`build_messages`) serves training, Surface-A eval and the Gate 3 parity dump, so
  the three cannot drift apart; training under one rendering and measuring under
  another is the silent failure prd.md Sec. 10.1 warns about. The flag is printed
  per model at train time and recorded in training_history.json and
  parity_hf.json's `system_role_folded` key.

  DECLARE IT IN LIMITATIONS, but at the right strength -- an earlier draft of this
  note overstated it as "weakening the control", and that is not quite right.

  The project's prompt rule is ALREADY "the model's own
  tokenizer.apply_chat_template, never hand-written". The three existing models are
  therefore already prompted in three DIFFERENT formats -- ChatML for Qwen, the
  Llama-3 format for Llama-3.2, SmolLM2's own for SmolLM2 -- differing in special
  tokens, role markers and whitespace. Per-model template variation is the
  protocol, not a departure from it, because it is how each model will actually be
  deployed. Danube's native format has no system turn, so expressing the
  instruction in Danube's native format MEANS folding. That is the same rule
  applied consistently, one step further than the other three happen to require.

  The precedent is not obscure. Google's Gemma family raises the identical error
  from the identical construct --
  `{% if messages[0]['role'] == 'system' %}{{ raise_exception('System role not
  supported') }}{% endif %}` -- and Google's own guidance is exactly this fold:
  put the system instruction in the first user message. A whole major model family
  is used this way by design.

  What survives as a genuine caveat, stated at its real size: the fold changes
  where the instruction sits relative to the role markers, so Danube's prompt
  differs from the other three by more than the usual template delta. For the
  ZERO-SHOT rows that could matter, since nothing has taught the model to read that
  layout. For the FINE-TUNED rows -- which is what Table 17 reports -- three epochs
  of completion-only training on 1,940 examples in this exact rendering make the
  scaffolding a learned fixed prefix, so the effect on the headline comparison is
  small. Say that, rather than a blanket "the comparison is confounded".

# Llama-2-derived architecture (16 layers, GQA, Mistral tokeniser), so all seven
# Table 14 target modules exist under their usual names and the recipe applies
# unchanged. This is why an iso-parameter control was picked from this family rather
# than from a Mamba/SSM hybrid, where the module list would not apply and "identical
# recipe across all models" would stop being literally true.
# Reported in Table 33 (the Surface-A iso-parameter comparison). Metadata,
# not a measurement of this project -- see param_source.
params: 513_590_784
family: H2O.ai (Danube3)
param_source: >
  MEASURED on Kaggle: the notebook printed 520,668,672 total after get_peft_model, minus the 7,077,888 LoRA parameters it also printed. Branded 500M; the report is arXiv 2407.09276.

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optim:
  optimizer: adamw_torch
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03

train:
  epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4      # effective batch 32: 4 x 4 x 2 GPUs (Kaggle T4 x2, Trainer DataParallel)
  max_seq_length: 256
  packing: false                      # packing corrupts completion masking
  completion_only_loss: true          # prompt tokens contribute no gradient
  seed: 42                            # identical across all four runs

precision: fp16
precision_note: >
  Table 14 specifies bf16. Kaggle's free accelerators are T4 (SM 7.5) and P100
  (SM 6.0); neither has hardware bf16, which needs Ampere (SM 8.0+). All four
  runs therefore use fp16 -- identically, so RQ1's "hold everything constant
  except the model" still holds and the ranking, which is the claim, is
  unaffected. Declared in the Table 17 caption and the Limitations table.

session_note: >
  This model is trained in a SEPARATE Kaggle session from the other three, using the
  notebook's ONLY escape hatch. fp16 training on a GPU is not bit-reproducible, so
  strictly this artefact does not come out of the same session under the same image
  as the other three, and that is a real caveat to declare in Limitations. The
  alternative -- retraining all four together -- would produce new adapters for the
  existing three that are not the ones every published result was measured on, and
  would invalidate Surface B, Tables 17/18/19, the McNemar tests and the abstention
  entry. A declared session caveat is the far cheaper of the two costs.

scope_note: >
  Surface A (FP16 reference) ONLY, and this is now a constraint rather than a triage
  choice. The GGUF produced by this notebook FAILS Gate 3 on the llama.cpp side: the
  formatted prompt is byte-identical on all ten audit prompts, but the two tokenisers
  segment that identical text differently -- ' dr'+'one' under HuggingFace against
  ' dro'+'ne' under llama.cpp -- because SentencePiece merge ranking is not unique
  across implementations. Same length, same detokenised string, no error anywhere.
  See `results/gate3_parity.md`, regenerate with
  `python eval/check_parity_gguf.py h2o-danube3-500m-chat gguf/h2o-danube3-500m-chat-f16.gguf --report`.
  An earlier version of this note justified the scope by Pi scheduling instead. That
  was wrong twice over: accuracy runs on the workstation, not the Pi (see the
  `eval/surface_b.py` docstring), so Surface B would have cost no Pi time; and the
  gate has since closed the option that note said it was preserving. A Surface-B
  number for this model would be measured under a segmentation the adapter never saw
  and would be misattributed to quantisation. Promoting it needs the tokeniser
  disagreement resolved first, not a free slot on the hardware. The other three
  models pass Gate 3 on all ten prompts, so Tables 17/18/19 are unaffected. Because
  this is a separately declared comparison rather than an expansion of Table 17's
  Family 1, the existing McNemar Bonferroni alpha of 0.0167 is unchanged.

checkpoint_selection: best validation exact match   # NOT best validation loss
